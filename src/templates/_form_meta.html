<form method="post" action="{{ acao }}" class="form-grade">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
  <label>Nome da meta
    <input name="nome" maxlength="100" required value="{{ form.get('nome', '') }}" placeholder="Ex.: Viagem">
  </label>
  <label>Valor desejado (R$)
    <input name="valor_objetivo" inputmode="decimal" required value="{{ form.get('valor_objetivo', '') }}" placeholder="0,00">
  </label>
  {% if permitir_vinculo_saldo %}
  <label class="check-saldo">
    <span><input type="checkbox" name="acompanhar_saldo" value="on"
      {% if form.get('acompanhar_saldo') %}checked{% endif %}
      {% if not pode_vincular_saldo and not form.get('acompanhar_saldo') %}disabled{% endif %}>
      Acompanhar saldo disponível</span>
    <small>Atualiza esta meta automaticamente com seu saldo após despesas e investimentos ({{ saldo_disponivel|brl }}).</small>
    {% if not pode_vincular_saldo and not form.get('acompanhar_saldo') %}<small>Outra meta já está vinculada ao saldo.</small>{% endif %}
  </label>
  {% endif %}
  <label class="campo-acumulado">Já economizado (R$)
    <input name="valor_acumulado" inputmode="decimal" value="{{ form.get('valor_acumulado', '') }}"
      placeholder="0,00" {% if form.get('acompanhar_saldo') %}readonly{% endif %}>
  </label>
  <button class="btn" type="submit">{{ rotulo }}</button>
</form>
